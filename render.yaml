services:
  - type: web
    runtime: node
    name: odonto-excellence-api
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PORTAL_ORIGIN
        sync: false
      - key: ODONTO_ADMIN_EMAIL
        sync: false
      - key: ODONTO_ADMIN_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PORTAL_PUBLIC_URL
        value: https://odonto-excellence-portal.onrender.com
      - key: NODE_ENV
        value: production
  - type: web
    runtime: static
    name: odonto-excellence-portal
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/odonto-excellence run build
    staticPublishPath: artifacts/odonto-excellence/dist/public
    autoDeployTrigger: commit
    envVars:
      - key: VITE_ODONTO_API_URL
        value: https://odonto-excellence-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
