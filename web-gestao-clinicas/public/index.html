<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>Central de Gestão · 12 Clínicas</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/report-intelligence.css" />
</head>
<body>
  <div id="login" class="login-screen">
    <div class="login-card">
      <div class="brand-mark">OE</div>
      <h1>Central de Gestão</h1>
      <p>12 clínicas · tratativas · retornos · franqueados</p>
      <form id="loginForm">
        <label>Senha administrativa</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="Digite sua senha" />
        <button class="btn primary" type="submit">Entrar</button>
      </form>
      <div id="loginError" class="error"></div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark small">OE</div><div><strong>Central de Gestão</strong><span>12 clínicas</span></div></div>
      <nav id="nav"></nav>
      <div class="sidebar-foot"><button id="exportBtn" class="ghost">Exportar backup</button><button id="logoutBtn" class="ghost">Sair</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><button id="menuToggle" class="icon-btn">☰</button><div><h2 id="pageTitle">Painel</h2><p id="pageHelp">Visão rápida das 12 clínicas.</p></div><div class="today" id="today"></div></header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/storage-api.js"></script>
  <script type="module" src="/app.js"></script>
  <script type="module" src="/report-intelligence.js"></script>
</body>
</html>
