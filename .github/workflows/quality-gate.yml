name: Quality Gate

on:
  push:
    branches:
      - fix/admin-mobile-training-ux
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared TypeScript libraries
        run: pnpm --filter @workspace/db run build && pnpm --filter @workspace/api-zod run build

      - name: Typecheck API
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Typecheck portal
        run: pnpm --filter @workspace/odonto-excellence run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build portal
        run: pnpm --filter @workspace/odonto-excellence run build
